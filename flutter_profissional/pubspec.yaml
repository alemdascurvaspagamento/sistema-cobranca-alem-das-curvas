name: coachflow_profissional
description: Coach Flow Profissional — multiplatform financial management.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.9.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  excel: ^4.0.6
  file_saver: ^0.2.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true

# Ícone do app (iPhone e Android): gerado na montagem pelo GitHub.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFC23D"
  adaptive_icon_foreground: "assets/icon/foreground.png"
