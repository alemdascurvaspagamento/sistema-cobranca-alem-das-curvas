name: Validate CoachFlow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts syntax
        run: |
          for f in coachflow-*.js; do node --check "$f"; done

      - name: Validate API client wiring
        shell: bash
        run: |
          grep -q 'COACHFLOW_API_CLIENT' index.html
          grep -q 'coachflow-api-client.js' index.html
          grep -q 'functions/v1/coachflow-api' coachflow-api-client-v10.js
          grep -q 'getSession' coachflow-api-client-v10.js
          grep -q 'Authorization' coachflow-api-client-v10.js
          grep -q 'coachflow-mobile-home4.js' coachflow-api-client.js
          grep -q 'coachflow:data-ready' index.html
          grep -q 'coachflow:data-ready' coachflow-mobile-home4.js

      - name: Validate supported application tables
        shell: bash
        run: |
          for table in Alunos horarios aulas cobrancas pagamentos feriados ganhos_extras configuracoes despesas despesas_fixas despesas_fixas_lancamentos; do
            grep -q "$table" coachflow-api-client-v10.js
            grep -q "$table" index.html
          done

      - name: Validate security headers
        shell: bash
        run: |
          grep -q 'Content-Security-Policy' index.html
          grep -q 'upgrade-insecure-requests' index.html
          ! grep -q 'serviceWorker.register' index.html
          ! grep -q 'service_role' index.html
          ! grep -q '/rest/v1/' index.html

      - name: Validate mobile agenda rules
        shell: bash
        run: |
          # adcSupabase é um `let` global: nunca ler via window.adcSupabase na Home
          ! grep -q 'window\.adcSupabase' coachflow-mobile-home4.js
          # datas sempre locais (UTC erra a partir das 21h no Brasil)
          ! grep -q 'toISOString' coachflow-mobile-home4.js
          grep -q 'function todayIso(){const d=new Date();return d.getFullYear()' coachflow-api-client-v10.js
          # sem fallback silencioso em localStorage na Home
          ! grep -q 'localStorage' coachflow-mobile-home4.js
