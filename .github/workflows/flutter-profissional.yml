# Verificação automática do Coach Flow Profissional (Flutter).
#
# A cada mudança na pasta flutter_profissional, o GitHub:
#   1. instala o Flutter;
#   2. roda os testes automáticos (contas de cobrança, dados de exemplo, telas);
#   3. procura erros no código;
#   4. monta a versão web, como a Vercel faz;
#   5. se tudo passou, gera o app de teste para Android e publica em
#      Releases > "Android - versão de teste" (link fixo, substituído a cada versão).
# Se algo falhar, aparece um X vermelho na mudança. Não mexe no Coach Flow Pessoal.

name: Coach Flow Profissional

on:
  push:
    paths:
      - 'flutter_profissional/**'
      - '.github/workflows/flutter-profissional.yml'
  pull_request:
    paths:
      - 'flutter_profissional/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-profissional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e montagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_profissional
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Baixar pacotes
        run: flutter pub get

      - name: Rodar os testes automáticos
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/testes.txt"

      - name: Explicar os testes que falharam
        if: failure()
        run: |
          # Junta as linhas importantes em um aviso só, visível na página da verificação.
          detalhe=$(grep -n -E "\[E\]|Expected:|Actual:|Which:|reason:|Exception|Error:|FAILED|overflowed|^test/|\.dart:[0-9]+" "$RUNNER_TEMP/testes.txt" \
            | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Testes que falharam::${detalhe}"
          {
            echo "### Testes que falharam"
            echo '```'
            tail -120 "$RUNNER_TEMP/testes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Procurar erros no código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Montar a versão web
        run: |
          flutter create --platforms=web --project-name coachflow_profissional . >/dev/null
          flutter build web --release

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Coach Flow Profissional"
            echo ""
            echo "Ramo: \`${GITHUB_REF_NAME}\` · versão: \`${GITHUB_SHA::7}\`"
            echo ""
            echo "Se todos os passos acima estão verdes, as contas de cobrança passaram nos testes e o app montou sem erros."
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: App de teste para Android
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_profissional
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar o projeto Android
        run: |
          # A pasta android é gerada aqui, só para montar o app de teste.
          flutter create --platforms=android --org br.com.alemdascurvas --project-name coachflow_profissional . >/dev/null
          # Identificador definitivo (o mesmo do iPhone) e ícone do app.
          sed -i -E 's/applicationId = "[^"]*"/applicationId = "br.com.alemdascurvas.coachflow"/' android/app/build.gradle.kts
          grep applicationId android/app/build.gradle.kts
          flutter pub get
          dart run flutter_launcher_icons
          manifest=android/app/src/main/AndroidManifest.xml
          # Nome que aparece no celular.
          sed -i 's/android:label="[^"]*"/android:label="Coach Flow"/' "$manifest"
          # Acesso à internet (fontes, WhatsApp) e permissão para abrir links.
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          grep -q '<queries>' "$manifest" && \
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>#' "$manifest"
          cat "$manifest"

      - name: Montar o app
        run: |
          flutter pub get
          # Só a versão para celulares atuais (64 bits): arquivo bem menor.
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/coach-flow-profissional.apk"
          size=$(du -m "$RUNNER_TEMP/coach-flow-profissional.apk" | cut -f1)
          internet=$(grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || true)
          echo "::notice title=App Android::Tamanho ${size} MB; permissão de internet: ${internet}"

      - name: Publicar o link de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=android-teste
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$RUNNER_TEMP/coach-flow-profissional.apk" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Android - versão de teste" \
            --notes "App de teste do Coach Flow Profissional, gerado automaticamente.

          Ramo: ${GITHUB_REF_NAME} · versão ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}

          Como instalar no celular Android:
          1. Toque em coach-flow-profissional.apk abaixo para baixar.
          2. Abra o arquivo. Se o Android pedir, permita instalar apps desta origem.
          3. Toque em Instalar.

          Usa dados de exemplo (demonstração). Nada é enviado de verdade."

