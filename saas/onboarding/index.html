<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CoachFlow — Primeiro acesso</title><style>:root{--ink:#211914;--muted:#776b64;--line:#e8e0da;--soft:#f7f4f1;--card:#fff;--gold:#c5a26c}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ef;color:var(--ink)}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(280px,.78fr) minmax(0,1.22fr)}.brand{padding:52px;display:flex;flex-direction:column;justify-content:space-between;background:#201a17;color:#fff}.logo{font-weight:900;letter-spacing:-1.2px;font-size:28px}.logo span{color:#d7b67d}.brand h1{font-size:clamp(38px,5vw,68px);line-height:.98;letter-spacing:-3px;max-width:650px;margin:50px 0 20px}.brand p{max-width:520px;color:#d1c8c2;line-height:1.65}.content{padding:36px;display:flex;align-items:center;justify-content:center}.panel{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 70px rgba(45,33,25,.08)}.progress{display:flex;gap:7px;margin-bottom:30px}.progress i{height:5px;flex:1;border-radius:99px;background:#eee8e3}.progress i.on{background:var(--ink)}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:900;color:#9b8778}h2{font-size:34px;letter-spacing:-1.3px;margin:8px 0}.lead{color:var(--muted);margin:0 0 25px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:17px;padding:17px;text-align:left;cursor:pointer}.choice.selected{border-color:#312720;box-shadow:0 7px 22px rgba(44,32,24,.08)}.choice b{display:block}.choice small{display:block;color:var(--muted);margin-top:5px}.field{margin:0 0 15px}.field label{display:block;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.7px;color:#796b63;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#8d796b}.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{margin-top:18px;background:var(--soft);border-radius:16px;padding:15px;color:#665950;font-size:13px}.billing{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.billing label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:14px;border-radius:14px}.billing input{margin-top:3px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.btn{border:0;border-radius:13px;padding:13px 20px;font-weight:850;cursor:pointer}.next{background:var(--ink);color:#fff}.back{background:var(--soft);color:#5f5149}.btn:disabled{opacity:.35}.note{font-size:12px;color:#94867e}.done{padding:10px 0}.doneCard{background:#f7f4f1;border-radius:20px;padding:24px;margin-top:20px}.doneCard h3{margin:0 0 12px}.summary{display:grid;gap:8px;font-size:13px;color:#665950}.summary b{color:#241b16}.moneyWrap{position:relative}.moneyWrap span{position:absolute;left:14px;top:13px;color:#877970}.moneyWrap input{padding-left:39px}@media(max-width:800px){.shell{display:block}.brand{min-height:220px;padding:28px}.brand h1{font-size:37px;margin:32px 0 9px;letter-spacing:-2px}.brand p{font-size:14px;margin:0}.content{padding:18px}.panel{padding:23px;border-radius:22px}h2{font-size:27px}.grid,.form2,.billing{grid-template-columns:1fr}.actions{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 25%);padding-top:25px}.note{display:none}}</style></head><body><main class="shell"><section class="brand"><div class="logo">Coach<span>Flow</span></div><div><h1>Seu trabalho é cuidar de pessoas. O resto precisa fluir.</h1><p>Agenda, clientes e finanças em uma experiência criada para profissionais que vivem de atendimento.</p></div><small>CoachFlow SaaS 1.0 · ambiente de desenvolvimento</small></section><section class="content"><div class="panel"><div class="progress" id="progress"></div><div id="view"></div></div></section></main><script>
const presets=[['personal_trainer','Personal Trainer','Aluno','Alunos','Aula','Aulas','Mensalidade','Personal Training',60],['psychologist','Psicólogo(a)','Paciente','Pacientes','Sessão','Sessões','Honorário','Psicoterapia',50],['physiotherapist','Fisioterapeuta','Paciente','Pacientes','Sessão','Sessões','Cobrança','Fisioterapia',60],['physician','Médico(a)','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta',60],['therapist','Terapeuta','Cliente','Clientes','Sessão','Sessões','Cobrança','Terapia',60],['nutritionist','Nutricionista','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta nutricional',60],['massage_therapist','Massagista','Cliente','Clientes','Sessão','Sessões','Cobrança','Massagem',60],['other','Outro','Cliente','Clientes','Atendimento','Atendimentos','Cobrança','Atendimento',60]];
const state={step:1,profession:null,profile:{name:'',phone:'',registration:''},billing:[],service:{name:'',duration:60,price:''},client:{name:'',phone:''},goal:''};const view=document.getElementById('view'),progress=document.getElementById('progress');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function p(){return presets.find(x=>x[0]===state.profession)||presets[7]}function bars(){progress.innerHTML='';for(let i=1;i<=6;i++){const x=document.createElement('i');if(i<=state.step)x.className='on';progress.appendChild(x)}}function nav(can=true){return '<div class="actions">'+(state.step>1?'<button class="btn back" onclick="back()">← Voltar</button>':'<span class="note">Configuração inicial · você poderá editar depois.</span>')+'<button class="btn next" '+(!can?'disabled':'')+' onclick="next()">'+(state.step===6?'Concluir':'Continuar →')+'</button></div>'}function header(title,lead){return '<div class="eyebrow">Etapa '+state.step+' de 6</div><h2>'+title+'</h2><p class="lead">'+lead+'</p>'}
function render(){bars();const pr=p();if(state.step===1){view.innerHTML=header('Qual é a sua profissão?','Vamos adaptar a linguagem do CoachFlow ao seu dia a dia.')+'<div class="grid">'+presets.map(x=>'<button class="choice '+(state.profession===x[0]?'selected':'')+'" onclick="pick(\''+x[0]+'\')"><b>'+x[1]+'</b><small>'+x[3]+' · '+x[5]+'</small></button>').join('')+'</div>'+(state.profession?'<div class="preview">Seu ambiente usará termos como <b>'+pr[3]+'</b>, <b>'+pr[5]+'</b> e <b>'+pr[6]+'</b>.</div>':'')+nav(!!state.profession)}else if(state.step===2){view.innerHTML=header('Conte um pouco sobre você','Essas informações identificam seu perfil profissional.')+'<div class="field"><label>Nome profissional</label><input id="name" value="'+esc(state.profile.name)+'" placeholder="Ex.: Ana Souza"></div><div class="form2"><div class="field"><label>Telefone</label><input id="phone" value="'+esc(state.profile.phone)+'" placeholder="(11) 99999-9999"></div><div class="field"><label>Registro profissional (opcional)</label><input id="reg" value="'+esc(state.profile.registration)+'" placeholder="CRM, CREF, CRP, CREFITO..."></div></div>'+nav(true)}else if(state.step===3){const opts=[['per_session','Por atendimento','Cobro cada '+pr[2].toLowerCase()+' separadamente'],['monthly','Mensalidade','Valor recorrente mensal'],['package','Pacote','Conjunto de '+pr[5].toLowerCase()],['subscription','Recorrência','Contrato semanal, mensal ou periódico']];view.innerHTML=header('Como você costuma cobrar?','Selecione uma ou mais formas. O CoachFlow pode combinar modelos.')+'<div class="billing">'+opts.map(o=>'<label><input type="checkbox" value="'+o[0]+'" '+(state.billing.includes(o[0])?'checked':'')+' onchange="bill(this)"><span><b>'+o[1]+'</b><small style="display:block;color:#7d7068;margin-top:4px">'+o[2]+'</small></span></label>').join('')+'</div>'+nav(state.billing.length>0)}else if(state.step===4){view.innerHTML=header('Cadastre seu primeiro serviço','Vamos criar uma base que poderá ser reutilizada nos próximos atendimentos.')+'<div class="field"><label>Nome do serviço</label><input id="service" value="'+esc(state.service.name||pr[7])+'"></div><div class="form2"><div class="field"><label>Duração</label><select id="duration">'+[30,45,50,60,75,90,120].map(n=>'<option '+((state.service.duration||pr[8])===n?'selected':'')+' value="'+n+'">'+n+' minutos</option>').join('')+'</select></div><div class="field"><label>Valor padrão</label><div class="moneyWrap"><span>R$</span><input id="price" inputmode="decimal" value="'+esc(state.service.price)+'" placeholder="0,00"></div></div></div>'+nav(true)}else if(state.step===5){view.innerHTML=header('Adicione seu primeiro '+pr[2].toLowerCase(),'Isso é opcional. Você poderá importar ou cadastrar mais '+pr[3].toLowerCase()+' depois.')+'<div class="field"><label>Nome</label><input id="client" value="'+esc(state.client.name)+'" placeholder="Nome completo"></div><div class="field"><label>Telefone (opcional)</label><input id="clientPhone" value="'+esc(state.client.phone)+'" placeholder="(11) 99999-9999"></div>'+nav(true)}else{view.innerHTML=header('Defina sua meta de receita','Uma referência simples para acompanhar a evolução do seu negócio ao longo do ano.')+'<div class="field"><label>Meta anual</label><div class="moneyWrap"><span>R$</span><input id="goal" inputmode="decimal" value="'+esc(state.goal)+'" placeholder="Ex.: 240.000"></div></div><div class="preview">O CoachFlow transformará a meta anual em referências mensais, trimestrais e semestrais — sem limitar sua análise a um único período.</div>'+nav(true)}}
function save(){if(state.step===2){state.profile={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),registration:document.getElementById('reg').value.trim()}}if(state.step===4){state.service={name:document.getElementById('service').value.trim(),duration:Number(document.getElementById('duration').value),price:document.getElementById('price').value.trim()}}if(state.step===5){state.client={name:document.getElementById('client').value.trim(),phone:document.getElementById('clientPhone').value.trim()}}if(state.step===6)state.goal=document.getElementById('goal').value.trim()}
function pick(v){state.profession=v;const pr=p();state.service.name=pr[7];state.service.duration=pr[8];render()}function bill(el){if(el.checked&&!state.billing.includes(el.value))state.billing.push(el.value);if(!el.checked)state.billing=state.billing.filter(x=>x!==el.value);render()}function back(){save();state.step--;render()}function next(){save();if(state.step<6){state.step++;render();return}finish()}function finish(){const pr=p();view.innerHTML='<div class="done"><div class="eyebrow">Configuração concluída</div><h2>Seu CoachFlow está tomando forma.</h2><p class="lead">Este protótipo já valida o fluxo completo. A próxima etapa será conectar essas escolhas ao Supabase.</p><div class="doneCard"><h3>Resumo do ambiente</h3><div class="summary"><span><b>Profissão:</b> '+esc(pr[1])+'</span><span><b>Perfil:</b> '+esc(state.profile.name||'Não informado')+'</span><span><b>Terminologia:</b> '+pr[3]+' · '+pr[5]+'</span><span><b>Serviço inicial:</b> '+esc(state.service.name||pr[7])+' · '+state.service.duration+' min</span><span><b>Primeiro '+pr[2].toLowerCase()+':</b> '+esc(state.client.name||'Cadastrar depois')+'</span><span><b>Meta anual:</b> '+esc(state.goal||'Definir depois')+'</span></div></div><div class="actions"><button class="btn back" onclick="state.step=1;render()">Revisar</button><button class="btn next" onclick="alert(\'Próxima fase: persistência segura no Supabase.\')">Ir para o CoachFlow →</button></div></div>'}render();
</script></body></html>
