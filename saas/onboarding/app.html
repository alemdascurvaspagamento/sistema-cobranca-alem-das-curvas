<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CoachFlow — Configuração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ef;color:#211914;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:.75fr 1.25fr}.brand{background:#201a17;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.logo{font-size:28px;font-weight:900}.logo span{color:#d7b67d}.brand h1{font-size:54px;line-height:1;letter-spacing:-2.5px;margin:40px 0 16px}.brand p{color:#d1c8c2;line-height:1.6}.main{display:flex;align-items:center;justify-content:center;padding:30px}.card{width:min(720px,100%);background:#fff;border:1px solid #e8e0da;border-radius:26px;padding:32px;box-shadow:0 20px 60px #39271912}.progress{display:flex;gap:7px;margin-bottom:28px}.progress i{height:5px;flex:1;background:#eee8e3;border-radius:9px}.progress i.on{background:#211914}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900;color:#9b8778}h2{font-size:32px;margin:7px 0}.lead{color:#776b64;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.choice{border:1px solid #e8e0da;background:#fff;border-radius:15px;padding:15px;text-align:left;cursor:pointer}.choice.sel{border-color:#211914}.choice b,.choice small{display:block}.choice small{color:#776b64;margin-top:4px}.field{margin-top:14px}.field label{display:block;font-size:11px;text-transform:uppercase;font-weight:850;color:#796b63;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #e8e0da;border-radius:12px;padding:13px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.checks label{border:1px solid #e8e0da;border-radius:14px;padding:14px;display:flex;gap:9px}.actions{display:flex;justify-content:space-between;margin-top:26px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:#211914;color:#fff}.back{background:#f5f2ef;color:#5f5149}.error{background:#fff1f1;color:#8c2f2f;border:1px solid #e9c2c2;padding:12px;border-radius:12px;margin:15px 0}.summary{background:#f7f4f1;border-radius:16px;padding:18px;margin-top:18px;display:grid;gap:7px}@media(max-width:800px){.shell{display:block}.brand{padding:26px;min-height:210px}.brand h1{font-size:36px;margin:28px 0 10px}.main{padding:16px}.card{padding:22px}.grid,.checks{grid-template-columns:1fr}h2{font-size:27px}}</style></head><body><main class="shell"><aside class="brand"><div class="logo">Coach<span>Flow</span></div><div><h1>Seu trabalho é cuidar de pessoas. O resto precisa fluir.</h1><p>Vamos configurar seu ambiente profissional em poucos passos.</p></div><small>CoachFlow SaaS 1.0</small></aside><section class="main"><div class="card"><div class="progress" id="progress"></div><div id="view"></div></div></section></main><script>
const URL='https://yjpxjzgvshaabjpdpbsc.supabase.co',KEY='sb_publishable_cfk3k9kcgmbvUp-oUmoNfw_rYLUzIge';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const presets=[['personal_trainer','Personal Trainer','Aluno','Alunos','Aula','Aulas','Mensalidade','Personal Training',60],['psychologist','Psicólogo(a)','Paciente','Pacientes','Sessão','Sessões','Honorário','Psicoterapia',50],['physiotherapist','Fisioterapeuta','Paciente','Pacientes','Sessão','Sessões','Cobrança','Fisioterapia',60],['physician','Médico(a)','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta',60],['therapist','Terapeuta','Cliente','Clientes','Sessão','Sessões','Cobrança','Terapia',60],['nutritionist','Nutricionista','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta nutricional',60],['massage_therapist','Massagista','Cliente','Clientes','Sessão','Sessões','Cobrança','Massagem',60],['other','Outro','Cliente','Clientes','Atendimento','Atendimentos','Cobrança','Atendimento',60]];
const s={step:1,profession:null,name:'',phone:'',reg:'',billing:[],service:'',duration:60,price:'',client:'',clientPhone:'',goal:''},view=document.getElementById('view'),progress=document.getElementById('progress');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const pr=()=>presets.find(x=>x[0]===s.profession)||presets[7];function bars(){progress.innerHTML=[1,2,3,4,5,6].map(n=>'<i class="'+(n<=s.step?'on':'')+'"></i>').join('')}function head(t,l){return '<div class="eyebrow">Etapa '+s.step+' de 6</div><h2>'+t+'</h2><p class="lead">'+l+'</p>'}function nav(){return '<div class="actions">'+(s.step>1?'<button class="btn back" onclick="back()">← Voltar</button>':'<span></span>')+'<button class="btn primary" onclick="next()">'+(s.step===6?'Concluir':'Continuar →')+'</button></div>'}
function render(){bars();const p=pr();if(s.step===1)view.innerHTML=head('Qual é a sua profissão?','A linguagem do CoachFlow será adaptada ao seu trabalho.')+'<div class="grid">'+presets.map(x=>'<button class="choice '+(s.profession===x[0]?'sel':'')+'" onclick="pick(\''+x[0]+'\')"><b>'+x[1]+'</b><small>'+x[3]+' · '+x[5]+'</small></button>').join('')+'</div>'+nav();if(s.step===2)view.innerHTML=head('Seu perfil profissional','Essas informações identificam você no seu espaço.')+field('name','Nome profissional',s.name,'Ana Souza')+field('phone','Telefone',s.phone,'(11) 99999-9999')+field('reg','Registro profissional (opcional)',s.reg,'CRM, CREF, CRP, CREFITO...')+nav();if(s.step===3){const a=[['per_session','Por atendimento'],['monthly','Mensalidade'],['package','Pacote'],['subscription','Recorrência']];view.innerHTML=head('Como você costuma cobrar?','Você pode selecionar mais de uma opção.')+'<div class="checks">'+a.map(x=>'<label><input type="checkbox" '+(s.billing.includes(x[0])?'checked':'')+' onchange="bill(\''+x[0]+'\',this.checked)"><b>'+x[1]+'</b></label>').join('')+'</div>'+nav()}if(s.step===4)view.innerHTML=head('Seu primeiro serviço','Crie a base do seu atendimento.')+field('service','Nome do serviço',s.service||p[7],'')+'<div class="grid">'+field('duration','Duração em minutos',s.duration,'60','number')+field('price','Valor padrão (R$)',s.price,'0,00')+'</div>'+nav();if(s.step===5)view.innerHTML=head('Primeiro '+p[2].toLowerCase(),'Opcional: você poderá cadastrar mais '+p[3].toLowerCase()+' depois.')+field('client','Nome',s.client,'Nome completo')+field('clientPhone','Telefone',s.clientPhone,'(11) 99999-9999')+nav();if(s.step===6)view.innerHTML=head('Meta anual de receita','Use uma referência para acompanhar a evolução do negócio.')+field('goal','Meta anual (R$)',s.goal,'240.000')+'<div class="summary"><b>Ambiente: '+p[1]+'</b><span>'+p[3]+' · '+p[5]+' · '+p[6]+'</span><span>Serviço: '+esc(s.service||p[7])+'</span></div>'+nav()}
function field(id,label,value,placeholder,type='text'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" placeholder="'+placeholder+'"></div>'}function save(){['name','phone','reg','service','duration','price','client','clientPhone','goal'].forEach(k=>{const e=document.getElementById(k);if(e)s[k]=e.value})}function pick(v){s.profession=v;const p=pr();s.service=p[7];s.duration=p[8];render()}function bill(v,on){if(on&&!s.billing.includes(v))s.billing.push(v);if(!on)s.billing=s.billing.filter(x=>x!==v)}function back(){save();s.step--;render()}function num(v){if(!v)return null;let x=String(v).replace(/R\$/g,'').replace(/\s/g,'');if(x.includes(','))x=x.replace(/\./g,'').replace(',','.');const n=Number(x);return Number.isFinite(n)?n:null}async function next(){save();if(s.step===1&&!s.profession)return fail('Escolha sua profissão.');if(s.step===2&&!s.name.trim())return fail('Informe seu nome profissional.');if(s.step===3&&!s.billing.length)return fail('Selecione pelo menos uma forma de cobrança.');if(s.step<6){s.step++;render();return}await finish()}function fail(m){render();const e=document.createElement('div');e.className='error';e.textContent=m;view.prepend(e)}
async function finish(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../../saas.html');return}const p=pr();view.innerHTML=head('Criando seu espaço','Estamos configurando seu CoachFlow com segurança.')+'<div class="summary"><b>Aguarde…</b><span>Perfil, serviço, linguagem e financeiro estão sendo preparados.</span></div>';const {data,error}=await sb.rpc('complete_coachflow_onboarding',{p_profession_code:s.profession,p_display_name:s.name.trim(),p_phone:s.phone.trim()||null,p_registration_number:s.reg.trim()||null,p_billing_models:s.billing,p_service_name:(s.service||p[7]).trim(),p_service_duration:Number(s.duration||p[8]),p_service_price:num(s.price)||0,p_client_name:s.client.trim()||null,p_client_phone:s.clientPhone.trim()||null,p_annual_goal:num(s.goal)});if(error)throw error;sessionStorage.setItem('coachflow_new_workspace',String(data||''));location.replace('../../saas.html?onboarding=completed')}catch(e){console.error(e);fail(e.message||'Não foi possível concluir o onboarding.')}}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../../saas.html');return}render()})().catch(e=>fail(e.message));
</script></body></html>
