<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoachFlow — Configuração</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ef;color:#211914}.shell{min-height:100vh;display:grid;grid-template-columns:.75fr 1.25fr}.brand{background:#201a17;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.logo{font-size:28px;font-weight:900}.logo span{color:#d7b67d}.brand h1{font-size:54px;line-height:1;margin:30px 0 15px;letter-spacing:-2px}.brand p{color:#d1c8c2}.main{display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(720px,100%);background:#fff;border:1px solid #e8e0da;border-radius:26px;padding:32px;box-shadow:0 20px 60px #39271912}.progress{display:flex;gap:7px;margin-bottom:26px}.progress i{height:5px;flex:1;background:#eee8e3;border-radius:9px}.progress i.on{background:#211914}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900;color:#9b8778}h2{font-size:32px;margin:7px 0}.lead{color:#776b64}.grid,.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.choice,.checks label{border:1px solid #e8e0da;background:#fff;border-radius:15px;padding:15px;text-align:left}.choice{cursor:pointer}.choice.sel{border-color:#211914;box-shadow:inset 0 0 0 1px #211914}.choice b,.choice small{display:block}.choice small{color:#776b64;margin-top:4px}.field{margin-top:14px}.field label{display:block;font-size:11px;text-transform:uppercase;font-weight:850;color:#796b63;margin-bottom:6px}.field input{width:100%;border:1px solid #e8e0da;border-radius:12px;padding:13px;font-size:15px}.actions{display:flex;justify-content:space-between;margin-top:26px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:#211914;color:#fff}.back{background:#f5f2ef}.error{background:#fff1f1;color:#8c2f2f;border:1px solid #e9c2c2;padding:12px;border-radius:12px;margin-bottom:15px}.summary{background:#f7f4f1;border-radius:16px;padding:18px;margin-top:18px;display:grid;gap:7px}@media(max-width:800px){.shell{display:block}.brand{padding:25px;min-height:200px}.brand h1{font-size:36px}.main{padding:15px}.card{padding:22px}.grid,.checks{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><aside class="brand"><div class="logo">Coach<span>Flow</span></div><div><h1>Seu trabalho é cuidar de pessoas. O resto precisa fluir.</h1><p>Vamos configurar seu ambiente profissional em poucos passos.</p></div><small>CoachFlow SaaS 1.0</small></aside><section class="main"><div class="card"><div class="progress" id="progress"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div id="view"><div class="eyebrow">Etapa 1 de 6</div><h2>Qual é a sua profissão?</h2><p class="lead">A linguagem do CoachFlow será adaptada ao seu trabalho.</p><div class="grid" id="initialChoices"><button class="choice" data-prof="personal_trainer"><b>Personal Trainer</b><small>Alunos · Aulas</small></button><button class="choice" data-prof="psychologist"><b>Psicólogo(a)</b><small>Pacientes · Sessões</small></button><button class="choice" data-prof="physiotherapist"><b>Fisioterapeuta</b><small>Pacientes · Sessões</small></button><button class="choice" data-prof="physician"><b>Médico(a)</b><small>Pacientes · Consultas</small></button><button class="choice" data-prof="therapist"><b>Terapeuta</b><small>Clientes · Sessões</small></button><button class="choice" data-prof="nutritionist"><b>Nutricionista</b><small>Pacientes · Consultas</small></button><button class="choice" data-prof="massage_therapist"><b>Massagista</b><small>Clientes · Sessões</small></button><button class="choice" data-prof="other"><b>Outro</b><small>Clientes · Atendimentos</small></button></div><div class="actions"><span></span><button class="btn primary" id="initialContinue">Continuar →</button></div></div></div></section></main>
<script>
(function(){
'use strict';
const URL='https://yjpxjzgvshaabjpdpbsc.supabase.co',KEY='sb_publishable_cfk3k9kcgmbvUp-oUmoNfw_rYLUzIge';
const P=[['personal_trainer','Personal Trainer','Aluno','Alunos','Aula','Aulas','Mensalidade','Personal Training',60],['psychologist','Psicólogo(a)','Paciente','Pacientes','Sessão','Sessões','Honorário','Psicoterapia',50],['physiotherapist','Fisioterapeuta','Paciente','Pacientes','Sessão','Sessões','Cobrança','Fisioterapia',60],['physician','Médico(a)','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta',60],['therapist','Terapeuta','Cliente','Clientes','Sessão','Sessões','Cobrança','Terapia',60],['nutritionist','Nutricionista','Paciente','Pacientes','Consulta','Consultas','Honorário','Consulta nutricional',60],['massage_therapist','Massagista','Cliente','Clientes','Sessão','Sessões','Cobrança','Massagem',60],['other','Outro','Cliente','Clientes','Atendimento','Atendimentos','Cobrança','Atendimento',60]];
const s={step:1,profession:null,name:'',phone:'',reg:'',billing:[],service:'',duration:60,price:'',client:'',clientPhone:'',goal:''};
const v=document.getElementById('view'),pg=document.getElementById('progress');let sb=null,sdkPromise=null;
const preset=()=>P.find(x=>x[0]===s.profession)||P[7];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function field(id,l,val='',ph='',type='text'){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}"></div>`}
function head(t,l){return `<div class="eyebrow">Etapa ${s.step} de 6</div><h2>${t}</h2><p class="lead">${l}</p>`}
function nav(){return `<div class="actions">${s.step>1?'<button class="btn back" data-act="back">← Voltar</button>':'<span></span>'}<button class="btn primary" data-act="next">${s.step===6?'Concluir':'Continuar →'}</button></div>`}
function render(){pg.innerHTML=[1,2,3,4,5,6].map(n=>`<i class="${n<=s.step?'on':''}"></i>`).join('');let p=preset();if(s.step===1)v.innerHTML=head('Qual é a sua profissão?','A linguagem do CoachFlow será adaptada ao seu trabalho.')+`<div class="grid">${P.map(x=>`<button class="choice ${s.profession===x[0]?'sel':''}" data-prof="${x[0]}"><b>${x[1]}</b><small>${x[3]} · ${x[5]}</small></button>`).join('')}</div>`+nav();if(s.step===2)v.innerHTML=head('Seu perfil profissional','Essas informações identificam você no seu espaço.')+field('name','Nome profissional',s.name,'Seu nome')+field('phone','Telefone',s.phone,'(11) 99999-9999')+field('reg','Registro profissional (opcional)',s.reg,'CRM, CREF, CRP, CREFITO...')+nav();if(s.step===3){let a=[['per_session','Por atendimento'],['monthly','Mensalidade'],['package','Pacote'],['subscription','Recorrência']];v.innerHTML=head('Como você costuma cobrar?','Você pode selecionar mais de uma opção.')+`<div class="checks">${a.map(x=>`<label><input type="checkbox" data-bill="${x[0]}" ${s.billing.includes(x[0])?'checked':''}> <b>${x[1]}</b></label>`).join('')}</div>`+nav()}if(s.step===4)v.innerHTML=head('Seu primeiro serviço','Crie a base do seu atendimento.')+field('service','Nome do serviço',s.service||p[7])+`<div class="grid">${field('duration','Duração em minutos',s.duration,'60','number')}${field('price','Valor padrão (R$)',s.price,'0,00')}</div>`+nav();if(s.step===5)v.innerHTML=head('Primeiro '+p[2].toLowerCase(),'Opcional: você poderá cadastrar mais depois.')+field('client','Nome',s.client,'Nome completo')+field('clientPhone','Telefone',s.clientPhone,'(11) 99999-9999')+nav();if(s.step===6)v.innerHTML=head('Meta anual de receita','Use uma referência para acompanhar a evolução do negócio.')+field('goal','Meta anual (R$)',s.goal,'240.000')+`<div class="summary"><b>Ambiente: ${p[1]}</b><span>${p[3]} · ${p[5]} · ${p[6]}</span><span>Serviço: ${esc(s.service||p[7])}</span></div>`+nav()}
function save(){['name','phone','reg','service','duration','price','client','clientPhone','goal'].forEach(k=>{let e=document.getElementById(k);if(e)s[k]=e.value})}
function fail(m){document.querySelector('.error')?.remove();let e=document.createElement('div');e.className='error';e.textContent=m;v.prepend(e)}
function num(x){if(!x)return null;x=String(x).replace(/R\$/g,'').replace(/\s/g,'');if(x.includes(','))x=x.replace(/\./g,'').replace(',','.');let n=Number(x);return Number.isFinite(n)?n:null}
function loadSdk(){if(window.supabase)return Promise.resolve(window.supabase);if(sdkPromise)return sdkPromise;sdkPromise=new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.async=true;sc.onload=()=>window.supabase?resolve(window.supabase):reject(new Error('SDK do banco não inicializou.'));sc.onerror=()=>reject(new Error('Não foi possível carregar a conexão com o banco.'));document.head.appendChild(sc);setTimeout(()=>reject(new Error('Tempo excedido ao carregar a conexão com o banco.')),10000)});return sdkPromise}
async function getDb(){if(sb)return sb;let lib=await loadSdk();sb=lib.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});return sb}
async function next(){save();if(s.step===1&&!s.profession)return fail('Escolha sua profissão.');if(s.step===2&&!s.name.trim())return fail('Informe seu nome profissional.');if(s.step===3&&!s.billing.length)return fail('Selecione pelo menos uma forma de cobrança.');if(s.step<6){s.step++;render();return}await finish()}
async function finish(){let p=preset();v.innerHTML=head('Criando seu espaço','Estamos configurando seu CoachFlow com segurança.')+'<div class="summary"><b>Aguarde…</b><span>Perfil, serviço e financeiro estão sendo preparados.</span></div>';try{let db=await getDb();let r=await Promise.race([db.rpc('complete_coachflow_onboarding',{p_profession_code:s.profession,p_display_name:s.name.trim(),p_phone:s.phone.trim()||null,p_registration_number:s.reg.trim()||null,p_billing_models:s.billing,p_service_name:(s.service||p[7]).trim(),p_service_duration:Number(s.duration||p[8]),p_service_price:num(s.price)||0,p_client_name:s.client.trim()||null,p_client_phone:s.clientPhone.trim()||null,p_annual_goal:num(s.goal)}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo excedido ao criar o espaço.')),15000))]);if(r.error)throw r.error;sessionStorage.setItem('coachflow_new_workspace',String(r.data||''));location.replace('../../saas.html?onboarding=completed')}catch(e){render();fail(e?.message||'Não foi possível concluir o onboarding.')}}
v.addEventListener('click',e=>{let p=e.target.closest('[data-prof]');if(p){s.profession=p.dataset.prof;let q=preset();s.service=q[7];s.duration=q[8];render();return}let a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='back'){save();s.step--;render()}else next()});
v.addEventListener('change',e=>{if(e.target.matches('[data-bill]')){let x=e.target.dataset.bill;s.billing=e.target.checked?[...new Set([...s.billing,x])]:s.billing.filter(y=>y!==x)}});
window.addEventListener('error',e=>{console.error('CoachFlow onboarding error',e.error||e.message);if(!v.innerText.trim())v.innerHTML='<div class="error"><b>Erro ao abrir a configuração.</b><br>Atualize a página. Se persistir, informe este código: JS-BOOT.</div>'});
window.addEventListener('unhandledrejection',e=>console.error('CoachFlow promise error',e.reason));
render();
})();
</script></body></html>
